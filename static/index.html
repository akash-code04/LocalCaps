<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalCaps</title>
<style>
  :root {
    --bg: #202124;
    --ink: #f1f1f1;
    --pn: #292b30;
    --field: #34363d;
    --ac: #b42343;
    --ac-hover: #d13556;
    --mut: #a6a8ae;
    --ln: #484a51;
    --danger: #ef667d
  }

  * {
    box-sizing: border-box
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif
  }

  header {
    height: 58px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    background: #18191c;
    border-bottom: 1px solid var(--ln)
  }

  header b {
    font-size: 19px;
    letter-spacing: -.3px
  }

  main {
    height: calc(100dvh - 58px);
    padding: 16px 20px;
    max-width: 1600px;
    margin: 0 auto;
    overflow: hidden
  }

  .workspace {
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    gap: 16px
  }

  .panel {
    background: var(--pn);
    border: 1px solid var(--ln);
    border-radius: 10px;
    min-width: 0;
    min-height: 0;
    padding: 14px
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0
  }

  #drop {
    flex: 1;
    min-height: 180px;
    border: 2px dashed #666a73;
    border-radius: 9px;
    padding: 24px;
    text-align: center;
    background: #24262a;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px
  }

  #drop.hov {
    border-color: var(--ac-hover);
    background: #30242a
  }

  #drop h2 {
    margin: 0;
    font-size: 22px
  }

  #drop p {
    color: var(--mut);
    margin: 0
  }

  .upload-mark {
    font-size: 32px;
    color: var(--ac-hover)
  }

  #file {
    display: none
  }

  #previewWrap {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
    justify-content: center
  }

  .preview-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #17181b;
    border-radius: 8px;
    padding: 8px
  }

  #c {
    display: block;
    width: 100%;
    height: 100%;
    max-height: 100%;
    object-fit: contain;
    background: #000;
    border-radius: 5px;
    touch-action: none;
    cursor: move
  }

  .preview-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap
  }

  .bar {
    display: flex;
    gap: 9px;
    align-items: center;
    min-width: 0
  }

  .bar input[type=range] {
    flex: 1;
    min-width: 50px
  }

  .bar span {
    white-space: nowrap;
    font-size: 12px;
    color: var(--mut)
  }

  .right-panel {
    display: grid;
    grid-template-rows: minmax(190px, 0.82fr) minmax(0, 1.18fr);
    gap: 12px;
    min-height: 0
  }

  #gen {
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    align-content: start;
    align-items: end;
    gap: 8px 12px;
    padding: 14px
  }

  #gen .runtime-block {
    grid-column: 1/-1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0
  }

  #gen .runtime-block label {
    margin: 0;
    white-space: nowrap
  }

  #runtime {
    font-size: 12px;
    color: var(--mut);
    min-width: 0;
    overflow-wrap: anywhere
  }

  .field label,
  label {
    display: block;
    font-size: 12px;
    color: var(--mut);
    margin: 0 0 4px
  }

  .field {
    min-width: 0
  }

  select,
  input[type=number],
  input[type=text],
  textarea {
    width: 100%;
    min-width: 0;
    padding: 8px 9px;
    border: 1px solid var(--ln);
    border-radius: 6px;
    font: inherit;
    color: var(--ink);
    background: var(--field)
  }

  select:focus,
  input:focus {
    outline-color: var(--ac)
  }

  button {
    font: inherit;
    cursor: pointer
  }

  button.p {
    background: var(--ac);
    color: #fff;
    border: 0;
    padding: 9px 14px;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap
  }

  button.p:hover {
    background: var(--ac-hover)
  }

  button.p:disabled {
    opacity: .45;
    cursor: not-allowed
  }

  button.s {
    background: #34363d;
    color: var(--ink);
    border: 1px solid var(--ln);
    padding: 7px 10px;
    border-radius: 6px
  }

  button.s:hover {
    border-color: #777b85
  }

  button:focus-visible {
    outline: 2px solid var(--ac-hover);
    outline-offset: 2px
  }

  #go {
    height: 37px
  }

  #msg {
    grid-column: 1/-1;
    margin: 0;
    color: var(--mut);
    font-size: 12px;
    overflow-wrap: anywhere
  }

  #msg.err {
    color: var(--danger)
  }

  #prog {
    grid-column: 1/-1;
    min-width: 0
  }

  #steps {
    display: flex;
    gap: 5px;
    font-size: 11px;
    flex-wrap: wrap;
    margin: 0 0 5px
  }

  .stp {
    padding: 2px 7px;
    border-radius: 99px;
    background: #3a3c42;
    color: var(--mut)
  }

  .stp.on {
    background: #633041;
    color: #fff
  }

  .stp.ok {
    background: #30463a;
    color: #a9dfb8
  }

  .pb {
    height: 7px;
    background: #41434a;
    border-radius: 99px;
    overflow: hidden;
    margin: 5px 0
  }

  .pb i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ac-hover);
    transition: width .3s
  }

  #pt {
    font-size: 11px;
    color: var(--mut)
  }

  .editor-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 0;
    overflow: hidden
  }

  .tabbar {
    display: flex;
    gap: 4px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--ln);
    flex-shrink: 0
  }

  .tab {
    background: transparent;
    color: var(--mut);
    border: 0;
    border-radius: 5px;
    padding: 7px 13px
  }

  .tab.active {
    background: #4a2933;
    color: #fff
  }

  .tab-content {
    display: none;
    min-height: 0;
    overflow: auto;
    padding: 12px
  }

  .tab-content.active {
    display: block
  }

  #pre {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px
  }

  #sty {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px 14px
  }

  #sty>div {
    min-width: 0
  }

  #sty label {
    margin: 0 0 3px
  }

  #sty select {
    padding: 6px 7px;
    font-size: 12px
  }

  #sty input[type=range] {
    width: 100%;
    accent-color: var(--ac)
  }

  #sty input[type=color] {
    width: 100%;
    height: 29px;
    border: 1px solid var(--ln);
    padding: 1px;
    background: var(--field);
    border-radius: 5px
  }

  #sty input[type=checkbox] {
    accent-color: var(--ac)
  }

  .font-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap
  }

  .font-row label {
    margin: 0
  }

  .font-row input {
    max-width: 260px;
    font-size: 12px;
    color: var(--mut)
  }

  .hint {
    font-size: 11px;
    color: var(--mut);
    margin: 8px 0 0
  }

  .caption-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px
  }

  .caption-toolbar h3 {
    font-size: 13px;
    margin: 0
  }

  .caption-actions {
    display: flex;
    gap: 6px
  }

  #list {
    max-height: none;
    overflow: visible
  }

  .row {
    display: grid;
    grid-template-columns: 65px 65px minmax(0, 1fr) 26px;
    gap: 6px;
    margin-bottom: 6px
  }

  .row input {
    padding: 6px;
    font-size: 12px
  }

  .row button {
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--danger)
  }

  #emptyCaps {
    font-size: 12px;
    color: var(--mut);
    padding: 14px 4px
  }

  #exp {
    margin-left: auto
  }

  #ems {
    font-size: 12px;
    color: var(--mut);
    overflow-wrap: anywhere
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1
  }

  @media(max-width:1050px) {
    main {
      padding: 10px
    }

    .workspace {
      gap: 10px
    }

    .right-panel {
      grid-template-rows: minmax(205px, .9fr) minmax(0, 1.1fr)
    }

    #gen {
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px
    }

    #go {
      width: 100%
    }
  }

  @media(max-height:760px) and (min-width:901px) {
    main {
      padding: 9px 14px
    }

    .panel {
      padding: 10px
    }

    #gen {
      padding: 10px
    }

    .right-panel {
      grid-template-rows: minmax(175px, .78fr) minmax(0, 1.22fr)
    }

    .tab-content {
      padding: 9px
    }

    #sty {
      gap: 4px 10px
    }

    #sty label {
      font-size: 11px
    }
  }

  @media(max-width:900px) {

    html,
    body {
      height: auto;
      min-height: 100%;
      overflow: auto
    }

    main {
      height: auto;
      min-height: calc(100dvh - 58px);
      overflow: visible
    }

    .workspace {
      height: auto;
      grid-template-columns: 1fr
    }

    .left-panel {
      min-height: 420px
    }

    .right-panel {
      grid-template-rows: auto minmax(400px, auto)
    }

    #gen {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .editor-panel {
      min-height: 420px
    }

    .tab-content {
      overflow: visible
    }

    #list {
      max-height: 340px;
      overflow: auto
    }
  }
</style>
<header><b>LocalCaps</b></header>
<main>
  <div class="workspace">
    <section class="panel left-panel" id="s1">
      <label id="drop" for="file"><span class="upload-mark">＋</span>
        <h2>Upload video or audio</h2>
        <p>Drop a file here or click to browse.</p>
        <p>Media stays on your computer.</p>
      </label>
      <input id="file" type="file" accept="video/*,audio/*">
      <div id="previewWrap">
        <div class="preview-stage"><canvas id="c"></canvas></div>
        <div class="bar"><button class="s" id="pp">Play</button><input id="seek" type="range" min="0" max="1000"
            value="0"><span id="tm">0:00</span></div>
        <div class="preview-actions"><button class="s" id="replace">Replace video</button><button class="p"
            id="exp">Export MP4</button><span id="ems"></span></div>
      </div>
    </section>
    <div class="right-panel">
      <section class="panel" id="s2">
        <div id="gen">
          <div class="runtime-block"><label>Runtime</label>
            <div id="runtime">Checking CPU/GPU availability...</div>
          </div>
          <div class="field"><label for="lang">Spoken language</label><select id="lang"></select></div>
          <div class="field"><label for="model">Whisper model</label><select id="model"></select></div>
          <div class="field"><label for="words">Max words per caption</label><input id="words" type="number" min="1"
              max="12" value="3"></div>
          <button class="p" id="go" disabled>Generate captions</button>
          <div id="msg">Upload a video or audio file to get started.</div>
          <div id="prog" hidden>
            <div id="steps"></div>
            <div class="pb"><i id="pbi"></i></div>
            <div id="pt"></div>
          </div>
        </div>
      </section>
      <section class="panel editor-panel" id="s3">
        <div class="tabbar" role="tablist" aria-label="Editor panels">
          <button class="tab active" id="styleTab" type="button" role="tab" aria-selected="true"
            aria-controls="stylePanel">Styling</button>
          <button class="tab" id="captionsTab" type="button" role="tab" aria-selected="false"
            aria-controls="captionsPanel">Captions</button>
        </div>
        <div class="tab-content active" id="stylePanel" role="tabpanel" aria-labelledby="styleTab">
          <h3 style="font-size:13px;margin:0 0 8px">Style presets</h3>
          <div id="pre"></div>
          <div id="sty"></div>
          <div class="font-row"><label for="font">Custom font file</label><input id="font" type="file"
              accept=".ttf,.otf,.woff,.woff2"></div>
          <p class="hint">Tip: drag the caption on the video preview to change its position.</p>
        </div>
        <div class="tab-content" id="captionsPanel" role="tabpanel" aria-labelledby="captionsTab">
          <div class="caption-toolbar">
            <h3>Caption text and timing</h3>
            <div class="caption-actions"><button class="s" id="srt">Download .srt</button><button class="s" id="add">+
                Add caption</button></div>
          </div>
          <div id="list">
            <div id="emptyCaps">Generate captions to edit their text and timing.</div>
          </div>
        </div>
      </section>
    </div>
  </div>
</main><video id="v" hidden playsinline></video>
<script>
  const $ = s => document.querySelector(s), V = $('#v'), C = $('#c'), X = C.getContext('2d');
  const LANGS = [['auto', 'Auto-detect'], ['hinglish', 'Hinglish (Hindi in English letters)'], ['hi', 'Hindi (Devanagari)'], ['en', 'English'], ['bn', 'Bengali'], ['mr', 'Marathi'], ['ta', 'Tamil'], ['te', 'Telugu'], ['ur', 'Urdu'], ['es', 'Spanish'], ['fr', 'French'], ['de', 'German'], ['pt', 'Portuguese'], ['ar', 'Arabic'], ['ru', 'Russian'], ['ja', 'Japanese'], ['ko', 'Korean'], ['zh', 'Chinese'], ['id', 'Indonesian'], ['tr', 'Turkish']];
  $('#lang').innerHTML = LANGS.map(l => `<option value="${l[0]}">${l[1]}</option>`).join('');
  const FONTS = ['Arial', 'Impact', 'Arial Black', 'Verdana', 'Trebuchet MS', 'Georgia', 'Comic Sans MS', 'Courier New'];
  const BASE = { font: 'Arial', size: 80, color: '#ffffff', hl: '#ffe600', stroke: '#000000', strokeW: 8, bg: '#000000', bgOn: false, upper: false, bold: true, glow: false, mode: 'plain', anim: 'fade', maxW: .85, x: .5, y: .78 };
  const PRESETS = { Clean: {}, Viral: { font: 'Impact', upper: true, size: 96, mode: 'karaoke', anim: 'pop', strokeW: 10 }, Boxed: { font: 'Verdana', mode: 'box', hl: '#6d3bff', strokeW: 0, anim: 'pop', size: 68 }, Neon: { font: 'Trebuchet MS', color: '#7df9ff', hl: '#ff3df2', glow: true, mode: 'karaoke', strokeW: 3, anim: 'word' }, Subtitle: { font: 'Georgia', bold: false, size: 56, strokeW: 0, bgOn: true, bg: '#000000b3', anim: 'none', y: .88 }, Playful: { font: 'Comic Sans MS', hl: '#ff4d6d', mode: 'karaoke', anim: 'slide', strokeW: 9 } };
  let st = { ...BASE }, caps = [], name = 'video';
  const F = [['font', 'Font', 'sel', FONTS], ['size', 'Size', 'rng', [24, 200, 1]], ['color', 'Text colour', 'col'], ['hl', 'Highlight colour', 'col'], ['stroke', 'Outline colour', 'col'], ['strokeW', 'Outline width', 'rng', [0, 24, 1]], ['bg', 'Box colour', 'col'], ['maxW', 'Max width', 'rng', [.3, 1, .05]], ['mode', 'Highlight style', 'sel', ['plain', 'karaoke', 'box']], ['anim', 'Animation', 'sel', ['none', 'fade', 'pop', 'slide', 'word']], ['x', 'Horizontal', 'rng', [0, 1, .01]], ['y', 'Vertical', 'rng', [0, 1, .01]], ['bgOn', 'Background box', 'chk'], ['upper', 'UPPERCASE', 'chk'], ['bold', 'Bold', 'chk'], ['glow', 'Glow', 'chk']];
  function buildStyle() { $('#sty').innerHTML = F.map(([k, l, t, o]) => `<div><label>${l}</label>` + (t == 'sel' ? `<select data-k="${k}">${o.map(v => `<option ${v == st[k] ? 'selected' : ''}>${v}</option>`).join('')}</select>` : t == 'rng' ? `<input data-k="${k}" type="range" min="${o[0]}" max="${o[1]}" step="${o[2]}" value="${st[k]}">` : t == 'col' ? `<input data-k="${k}" type="color" value="${st[k].slice(0, 7)}">` : `<input data-k="${k}" type="checkbox" ${st[k] ? 'checked' : ''}>`) + '</div>').join('') }
  $('#sty').oninput = e => { const k = e.target.dataset.k, t = e.target.type; st[k] = t == 'checkbox' ? e.target.checked : t == 'range' ? +e.target.value : e.target.value };
  $('#pre').innerHTML = Object.keys(PRESETS).map(p => `<button class="s">${p}</button>`).join('');
  $('#pre').onclick = e => { if (e.target.tagName == 'BUTTON') { st = { ...BASE, ...PRESETS[e.target.textContent] }; buildStyle() } };
  $('#font').onchange = async e => { const f = e.target.files[0]; if (!f) return; const n = 'U' + f.name.replace(/\W/g, ''); const ff = new FontFace(n, await f.arrayBuffer()); document.fonts.add(await ff.load()); FONTS.push(n); st.font = n; buildStyle() };
  // The editor is now a single persistent workspace; keep show() as a no-op for existing flow calls.
  function show(_step) { }
  // upload
  function load(f) { if (!f) return; if (!f.type.startsWith('video/')) { if (f.type.startsWith('audio/')) { window.file = f; $('#go').disabled = false; $('#msg').textContent = 'Audio selected. Transcription is available; video preview and MP4 export require a video.'; $('#previewWrap').style.display = 'none'; $('#drop').style.display = 'flex'; return; } alert('Please select a supported video or audio file.'); return; } name = f.name.replace(/\.[^.]+$/, ''); if (V.src) URL.revokeObjectURL(V.src); caps = []; renderList(); window.file = f; $('#go').disabled = false; $('#msg').textContent = 'Video ready. Choose your transcription settings.'; $('#drop').style.display = 'none'; $('#previewWrap').style.display = 'flex'; V.src = URL.createObjectURL(f); V.onloadedmetadata = () => { C.width = V.videoWidth || 1280; C.height = V.videoHeight || 720; V.currentTime = .01; }; }
  $('#file').onchange = e => load(e.target.files[0]);
  $('#replace').onclick = () => $('#file').click();
  const dr = $('#drop'); dr.ondragover = e => { e.preventDefault(); dr.classList.add('hov') }; dr.ondragleave = () => dr.classList.remove('hov'); dr.ondrop = e => { e.preventDefault(); dr.classList.remove('hov'); load(e.dataTransfer.files[0]) };
  // generate
  const MODELS = [['tiny', 'tiny - fastest, rough', '75 MB'], ['base', 'base', '145 MB'], ['small', 'small - good balance', '485 MB'], ['medium', 'medium - accurate, slower', '1.5 GB'], ['large-v3', 'large-v3 - best, needs strong PC', '3 GB']];
  let have = {};
  async function refreshModels() {
    try { have = await (await fetch('/api/models')).json() } catch (e) { } const cur = $('#model').value || 'small';
    $('#model').innerHTML = MODELS.map(([v, l, s]) => `<option value="${v}">${l} | ${have[v] ? '✓ downloaded' : 'not downloaded (~' + s + ')'}</option>`).join(''); $('#model').value = cur
  }
  refreshModels();
  (async () => { try { const r = await fetch('/api/runtime'); const d = await r.json(); const el = $('#runtime'); el.textContent = d.device.toUpperCase() + ' · ' + d.compute_type + (d.warning ? ' — ' + d.warning : ''); el.style.color = d.device === 'cuda' ? '#14783a' : 'var(--mut)' } catch (e) { $('#runtime').textContent = 'Runtime information unavailable' } })();
  const mb = b => (b / 1048576).toFixed(0), LBL = { download: 'Download model', load: 'Load model', transcribe: 'Transcribe' };
  function showProg(j, need) {
    const ph = need ? ['download', 'load', 'transcribe'] : ['load', 'transcribe'], i = ph.indexOf(j.phase);
    $('#steps').innerHTML = ph.map((p, k) => `<span class="stp ${k < i || j.phase == 'done' ? 'ok' : k == i ? 'on' : ''}">${k < i || j.phase == 'done' ? '✓ ' : ''}${LBL[p]}</span>`).join('');
    const pct = j.phase == 'load' ? 100 : j.pct || 0; $('#pbi').style.width = pct + '%';
    $('#pt').textContent = j.phase == 'download' ? (j.total ? `Downloading model: ${mb(j.done || 0)} / ${mb(j.total || 0)} MB (${pct}%)` : (j.msg || 'Downloading model...')) : j.phase == 'load' ? 'Loading model into memory...' : j.phase == 'transcribe' ? `Transcribing audio: ${pct}%` : j.phase == 'queued' ? 'Starting...' : ''
  }
  $('#go').onclick = async () => {
    const m = $('#msg'), b = $('#go'), pr = $('#prog'); m.className = ''; m.textContent = ''; b.disabled = true; pr.hidden = false; showProg({ phase: 'queued' }, false);
    if (!window.file) { m.className = 'err'; m.textContent = 'Upload a video or audio file first.'; b.disabled = false; return; } const fd = new FormData(); fd.append('file', window.file); fd.append('model', $('#model').value); fd.append('language', $('#lang').value); fd.append('words', $('#words').value);
    try {
      const need = !have[$('#model').value], r = await fetch('/api/transcribe', { method: 'POST', body: fd }), d = await r.json(); if (!r.ok) throw Error(d.error);
      while (true) {
        await new Promise(r => setTimeout(r, 500)); const j = await (await fetch('/api/job/' + d.id)).json(); showProg(j, need);
        if (j.phase == 'error') throw Error(j.msg); if (j.phase == 'done') { caps = j.result.captions; break }
      }
      renderList(); buildStyle(); activateTab('captions'); show(3); pr.hidden = true
    } catch (e) { m.className = 'err'; m.textContent = 'Failed: ' + e.message }
    b.disabled = false; refreshModels()
  };
  // caption list

  $('#list').oninput = e => { const d = e.target.dataset; caps[d.i][d.f] = d.f == 'text' ? e.target.value : +e.target.value };

  $('#add').onclick = () => { const t = V.currentTime; caps.push({ start: +t.toFixed(2), end: +(t + 1.5).toFixed(2), text: 'New caption' }); caps.sort((a, b) => a.start - b.start); renderList() };
  // player
  const mmss = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  $('#pp').onclick = () => { V.paused ? V.play() : V.pause() }; V.onplay = () => $('#pp').textContent = 'Pause'; V.onpause = () => $('#pp').textContent = 'Play';
  $('#seek').oninput = e => V.currentTime = e.target.value / 1000 * V.duration;
  V.ontimeupdate = () => { $('#seek').value = V.currentTime / V.duration * 1000; $('#tm').textContent = mmss(V.currentTime) + ' / ' + mmss(V.duration) };
  addEventListener('keydown', e => { if (e.code == 'Space' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); $('#pp').click() } });
  // drag to place
  let drag = 0; const pos = e => { const r = C.getBoundingClientRect(); st.x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); st.y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); buildStyle() };
  C.onpointerdown = e => { drag = 1; C.setPointerCapture(e.pointerId); pos(e) }; C.onpointermove = e => drag && pos(e); C.onpointerup = () => drag = 0;
  // Audio is taken from the original uploaded file by the server during MP4 export.

  const wordsOf = c => { const w = c.text.split(/\s+/).filter(Boolean), tot = w.reduce((a, b) => a + b.length + 1, 0), d = c.end - c.start; let t = c.start; return w.map(s => { const a = t; t += d * (s.length + 1) / tot; return { s, a, b: t } }) };

  $('#exp').onclick = async () => {
    const button = $('#exp'), status = $('#ems');
    let stream = null, recorder = null, oldMuted = V.muted;

      await recordingFinished;

      V.muted = oldMuted;
      V.onended = null;

      status.textContent = 'Combining original audio with FFmpeg...';

      const formData = new FormData();
      formData.append('rendered_video', renderedBlob, name + '_silent.webm');
      formData.append('original_video', window.file, window.file.name);

      const response = await fetch('/api/export', { method: 'POST', body: formData });

      if (!response.ok) {

        try { const data = await response.json(); if (data.error) message = data.error } catch (e) { }

      }

      const url = URL.createObjectURL(mp4Blob);

      link.href = url;
      link.download = name + '_captioned.mp4';
      link.click();

      V.muted = oldMuted;
      V.onended = null;
      status.textContent = 'Export failed: ' + error.message;

      }

      button.disabled = false;
    }
  };

  // srt
  const ts = t => new Date(t * 1000).toISOString().slice(11, 23).replace('.', ',');
  $('#srt').onclick = () => { const s = caps.map((c, i) => `${i + 1}\n${ts(c.start)} --> ${ts(c.end)}\n${c.text}\n`).join('\n'), a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'text/plain' })); a.download = name + '.srt'; a.click() };
  function activateTab(which) { const styling = which === 'style'; $('#styleTab').classList.toggle('active', styling); $('#captionsTab').classList.toggle('active', !styling); $('#styleTab').setAttribute('aria-selected', String(styling)); $('#captionsTab').setAttribute('aria-selected', String(!styling)); $('#stylePanel').classList.toggle('active', styling); $('#captionsPanel').classList.toggle('active', !styling) }

  $('#file').addEventListener('change', e => { if (e.target.files[0]) activateTab('style') });
  buildStyle(); renderList(); show(1);
